<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BixTrak</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Application</p>
          <h1>BixTrak</h1>
        </div>
      </header>

      <main class="content">
        <section class="selector-panel card">
          <label for="station-search">Rechercher une station</label>
          <input
            id="station-search"
            type="text"
            placeholder="Tapez le nom d’une station..."
            autocomplete="off"
          />

          <label for="station-select" class="select-label">Choisir une station</label>
          <select id="station-select">
            <option value="">Chargement…</option>
          </select>

          <div class="action-row">
            <button id="favorite-toggle" type="button">Ajouter aux favoris</button>
          </div>
        </section>

        <section class="stats-grid">
          <article class="card stat-card accent-blue">
            <span class="label">Vélo régulier</span>
            <strong id="regular-bike-count">0</strong>
          </article>

          <article class="card stat-card accent-green">
            <span class="label">Vélo électrique</span>
            <strong id="ebike-count">0</strong>
          </article>

          <article class="card stat-card accent-orange">
            <span class="label">Dock libre</span>
            <strong id="dock-count">0</strong>
          </article>
        </section>

        <section class="details card">
          <h2 id="station-name">Station</h2>
          <p id="station-meta">Sélectionnez une station pour voir les détails.</p>
          <p id="station-status" class="status-line">Statut : --</p>
        </section>

        <section class="favorites card">
          <h3>Favoris</h3>
          <ul id="favorite-list" class="favorite-list">
            <li class="empty-state">Aucun favori pour le moment.</li>
          </ul>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
