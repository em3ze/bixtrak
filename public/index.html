<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BixTrak</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="theme-dark">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap" aria-label="BixTrak logo">
          <div class="brand-mark" aria-hidden="true">
            <span>B</span>
          </div>
          <div class="brand-copy">
            <p class="eyebrow">Application</p>
            <h1>BixTrak</h1>
          </div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Basculer le thème">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3.75v2.1m0 12.3v2.1m8.25-8.25h-2.1m-12.3 0h-2.1M16.7 7.3l-1.5-1.5m-8.4 8.4-1.5 1.5m0-8.4 1.5-1.5m8.4 8.4 1.5 1.5M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" />
          </svg>
        </button>
      </header>

      <main class="content">
        <section class="selector-panel card">
          <div class="search-wrap">
            <label for="station-search">Rechercher une station</label>
            <div class="search-input-shell">
              <span class="search-icon">⌕</span>
              <input
                id="station-search"
                type="text"
                placeholder="Tapez le nom d’une station..."
                autocomplete="off"
              />
            </div>
          </div>

          <label for="station-select" class="select-label">Choisir une station</label>
          <select id="station-select">
            <option value="">Chargement…</option>
          </select>

          <div class="action-row">
            <button id="favorite-toggle" type="button">Ajouter aux favoris</button>
          </div>
        </section>

        <section class="stats-grid">
          <article class="card stat-card accent-blue">
            <div class="card-header">
              <span class="card-icon">🚲</span>
              <span class="label">Vélo régulier</span>
            </div>
            <strong id="regular-bike-count">0</strong>
          </article>

          <article class="card stat-card accent-green">
            <div class="card-header">
              <span class="card-icon">⚡</span>
              <span class="label">Vélo électrique</span>
            </div>
            <strong id="ebike-count">0</strong>
          </article>

          <article class="card stat-card accent-orange">
            <div class="card-header">
              <span class="card-icon">🅿️</span>
              <span class="label">Dock libre</span>
            </div>
            <strong id="dock-count">0</strong>
          </article>
        </section>

        <section class="details card">
          <div class="details-topline">
            <span class="details-icon">📍</span>
            <h2 id="station-name">Station</h2>
          </div>
          <p id="station-meta">Sélectionnez une station pour voir les détails.</p>
          <p id="station-status" class="status-line" data-status="unknown">Statut : --</p>
        </section>

        <section class="favorites card">
          <h3>Favoris</h3>
          <ul id="favorite-list" class="favorite-list">
            <li class="empty-state">Aucun favori pour le moment.</li>
          </ul>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
